<div class="cloudflared-settings-modal">
    <div class="modal-header">
        <div class="modal-title">Cloudflare Tunnel</div>
        <div class="close" data-local-action="closeModal" aria-label="Close">
            <img class="close-icon" src="/explorer/assets/icons/x-mark.svg" alt="close">
        </div>
    </div>

    <div class="modal-body cloudflared-settings-body">
        <div class="cloudflared-status-grid">
            <div class="cloudflared-status-card">
                <span class="cloudflared-status-label">Tunnel</span>
                <strong id="cloudflaredTunnelState">Loading</strong>
            </div>
            <div class="cloudflared-status-card">
                <span class="cloudflared-status-label">Cloudflare API</span>
                <strong id="cloudflaredApiState">Loading</strong>
            </div>
            <div class="cloudflared-status-card">
                <span class="cloudflared-status-label">Base Domain</span>
                <strong id="cloudflaredBaseDomain">Any</strong>
            </div>
        </div>

        <div class="cloudflared-toolbar">
            <div class="cloudflared-toolbar-title">Routes</div>
            <div class="cloudflared-toolbar-actions">
                <button type="button" class="general-button" data-route-action="refresh">Refresh</button>
                <button type="button" class="general-button" data-route-action="add">Add Route</button>
                <button type="button" class="general-button" data-route-action="validate">Validate</button>
                <button type="button" class="general-button primary" data-route-action="apply">Apply</button>
            </div>
        </div>

        <div class="cloudflared-route-shell">
            <table class="cloudflared-route-table" aria-label="Cloudflare Tunnel routes">
                <thead>
                    <tr>
                        <th scope="col">Enabled</th>
                        <th scope="col">Hostname</th>
                        <th scope="col">Path</th>
                        <th scope="col">Origin</th>
                        <th scope="col">Description</th>
                        <th scope="col">Remove</th>
                    </tr>
                </thead>
                <tbody id="cloudflaredRoutesBody"></tbody>
            </table>
        </div>

        <label class="cloudflared-dns-toggle">
            <input id="cloudflaredCreateDns" type="checkbox">
            <span>Create DNS records</span>
        </label>

        <label class="form-item cloudflared-ingress-wrap">
            <span class="form-label">Ingress Preview</span>
            <textarea id="cloudflaredIngressPreview" class="form-input" rows="8" readonly spellcheck="false"></textarea>
        </label>

        <div id="cloudflaredSettingsStatus" class="cloudflared-settings-status" role="status" aria-live="polite"></div>
    </div>
</div>
