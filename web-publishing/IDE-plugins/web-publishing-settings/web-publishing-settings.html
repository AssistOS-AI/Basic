<section class="web-publishing-settings">
    <div class="web-publishing-toolbar">
        <select id="webPublishingMode" aria-label="Mode">
            <option value="nginx">nginx</option>
            <option value="cloudflare-token">cloudflare-token</option>
            <option value="cloudflare-api">cloudflare-api</option>
            <option value="nginx-cloudflare">nginx-cloudflare</option>
        </select>
        <select id="webPublishingTlsEdge" aria-label="Trusted TLS edge">
            <option value="none">TLS edge: none (local)</option>
            <option value="cloudflare">TLS edge: Cloudflare</option>
            <option value="external">TLS edge: external</option>
        </select>
        <input id="webPublishingBaseDomain" type="text" autocomplete="off" placeholder="example.com">
        <input id="webPublishingLivekitMediaIp" type="text" inputmode="decimal" autocomplete="off" placeholder="LiveKit media IPv4">
        <input id="webPublishingTurnExternalIp" type="text" inputmode="decimal" autocomplete="off" placeholder="TURN external IPv4">
        <input id="webPublishingTunnelSource" type="hidden">
        <input id="webPublishingTunnelTokenSet" type="hidden">
        <input id="webPublishingTunnelId" type="hidden">
        <input id="webPublishingTunnelName" type="hidden">
        <label class="web-publishing-check">
            <input id="webPublishingCreateDns" type="checkbox">
            <span>Create tunnel and DNS records</span>
        </label>
        <button id="webPublishingRefresh" type="button">Refresh</button>
        <button id="webPublishingValidate" type="button">Validate</button>
        <button id="webPublishingApply" type="button">Apply</button>
    </div>
    <div id="webPublishingStatus" class="web-publishing-status" aria-live="polite"></div>
    <div class="web-publishing-state" aria-live="polite">
        <span>API token <strong id="webPublishingApiTokenState">unknown</strong></span>
        <span>Account <strong id="webPublishingAccountState">unknown</strong></span>
        <span>DNS zone <strong id="webPublishingZoneState">unknown</strong></span>
        <span>Tunnel token <strong id="webPublishingTunnelTokenState">unknown</strong></span>
    </div>
    <table class="web-publishing-routes">
        <thead>
            <tr>
                <th>Enabled</th>
                <th>Host</th>
                <th>Path</th>
                <th>Origin</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody id="webPublishingRoutes"></tbody>
    </table>
</section>
